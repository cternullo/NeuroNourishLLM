<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroNourish</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0c0c10;
  --surface:     #13131a;
  --surface2:    #1a1a24;
  --surface3:    #21212e;
  --border:      #27273a;
  --text:        #d6d6e0;
  --text-muted:  #52527a;
  --accent:      #7c5cbf;
  --accent-h:    #a07de8;
  --accent-dim:  #32284d;
  --success:     #34c87e;
  --error:       #e05555;
  --user-bg:     #14203a;
  --user-border: #1e3558;
  --asst-bg:     #14141c;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.55; }

/* ── Layout ──────────────────────────────────────────────────── */

.layout { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────── */

.sidebar {
  width: 268px; min-width: 268px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

.sidebar-head {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-head h1 { font-size: 16px; font-weight: 700; color: var(--accent-h); letter-spacing: -0.3px; }
.sidebar-head .tagline { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.sidebar-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.sidebar-scroll::-webkit-scrollbar { width: 3px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.s-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }

.s-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.9px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
}

/* ── Ingest tabs ─────────────────────────────────────────────── */

.tabs { display: flex; gap: 2px; background: var(--surface2); border-radius: 6px; padding: 2px; margin-bottom: 10px; }

.tab-btn {
  flex: 1; padding: 5px 6px; background: none; border: none;
  border-radius: 4px; color: var(--text-muted); font-size: 12px;
  cursor: pointer; transition: all 0.12s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

.tab-pane { display: none; }
.tab-pane.active { display: block; }

.ingest-row { display: flex; gap: 6px; align-items: flex-start; }

input[type="text"], input[type="file"] {
  flex: 1; min-width: 0;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 5px; padding: 7px 9px;
  color: var(--text); font-size: 12px; outline: none;
  transition: border-color 0.15s;
}
input[type="text"]:focus { border-color: var(--accent); }
input[type="file"] { padding: 5px 7px; color: var(--text-muted); font-size: 11px; cursor: pointer; }

.pdf-row { display: flex; flex-direction: column; gap: 6px; }

.btn {
  padding: 7px 11px; background: var(--accent); border: none;
  border-radius: 5px; color: #fff; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background 0.12s; flex-shrink: 0;
}
.btn:hover { background: var(--accent-h); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-sm { padding: 4px 8px; font-size: 11px; }
.btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface3); color: var(--text); }

.status { font-size: 11px; padding: 5px 8px; border-radius: 4px; margin-top: 6px; display: none; }
.status.ok  { background: #0c2a1e; color: var(--success); display: block; }
.status.err { background: #2a0e0e; color: var(--error);   display: block; }

/* ── Notes ───────────────────────────────────────────────────── */

.notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.notes-head .s-label { margin-bottom: 0; }

.notes-list { display: flex; flex-direction: column; gap: 2px; max-height: 160px; overflow-y: auto; }
.notes-list::-webkit-scrollbar { width: 3px; }
.notes-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.note-item { padding: 6px 8px; border-radius: 5px; cursor: pointer; transition: background 0.1s; }
.note-item:hover { background: var(--surface2); }
.note-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.note-date { font-size: 10px; color: var(--text-muted); }

/* ── Activity (Team) ─────────────────────────────────────────── */

.activity-header {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
}
.act-toggle {
  background: none; border: none; color: var(--text-muted);
  font-size: 12px; cursor: pointer; padding: 0; line-height: 1;
}
.activity-list {
  display: flex; flex-direction: column; gap: 9px;
  max-height: 240px; overflow-y: auto; margin-top: 8px;
}
.activity-list::-webkit-scrollbar { width: 3px; }
.activity-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.act-item   { display: flex; flex-direction: column; gap: 2px; }
.act-user   { font-size: 11px; font-weight: 700; color: var(--text); }
.act-detail { font-size: 11px; color: var(--text-muted); }
.act-time   { font-size: 10px; color: var(--text-muted); }

/* Action type badges */
.badge {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.3px;
  margin-right: 4px; vertical-align: middle;
}
.badge-topic { background: #162040; color: #5b9cf6; }
.badge-url   { background: #261640; color: #9b7de8; }
.badge-pdf   { background: #301a08; color: #e8943b; }
.badge-chat  { background: #0a2018; color: var(--success); }

/* Pulsing dot shown when a new entry appears since last refresh */
.pulse-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--success); margin-left: 6px; vertical-align: middle;
  animation: pulse-green 2s ease-in-out infinite;
}
@keyframes pulse-green {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50%       { opacity: 1;   transform: scale(1.1); }
}

/* ── Suggestion chips ────────────────────────────────────────── */

.suggest-wrap { margin-top: 8px; }
.suggest-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.7px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 5px; animation: chip-in 0.35s ease; }
@keyframes chip-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 20px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 11px; font-family: var(--font);
  cursor: pointer; transition: all 0.15s; white-space: nowrap; line-height: 1.4;
}
.chip:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-h); }
.chip-arrow { color: var(--accent); font-style: normal; }

/* "Not you?" link beside the username badge */
.not-you {
  font-size: 10px; color: var(--text-muted); text-decoration: none; cursor: pointer;
}
.not-you:hover { color: var(--text); text-decoration: underline; }

/* ── Chat panel ──────────────────────────────────────────────── */

.chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.chat-head {
  padding: 11px 20px; border-bottom: 1px solid var(--border);
  background: var(--surface); display: flex; align-items: center;
  gap: 12px; flex-shrink: 0;
}
.chat-head-title { font-size: 13px; color: var(--text-muted); margin-right: auto; }

.username-badge {
  font-size: 11px; font-weight: 700;
  background: var(--accent-dim); color: var(--accent-h);
  padding: 3px 10px; border-radius: 12px; letter-spacing: 0.2px;
}

/* ── Messages ────────────────────────────────────────────────── */

.messages {
  flex: 1; overflow-y: auto; padding: 24px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.welcome {
  margin: auto; text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.welcome .icon { font-size: 52px; margin-bottom: 14px; }
.welcome h2 { font-size: 19px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
.welcome p  { font-size: 13px; max-width: 320px; margin: 0 auto; }

.msg { max-width: 860px; width: 100%; }
.msg.user      { align-self: flex-end;   }
.msg.assistant { align-self: flex-start; }

.bubble {
  padding: 12px 16px; border-radius: 10px;
  font-size: 14px; line-height: 1.65;
}
.msg.user .bubble {
  background: var(--user-bg); border: 1px solid var(--user-border);
  color: #c2d4f0; border-radius: 10px 10px 2px 10px;
}
.msg.assistant .bubble {
  background: var(--asst-bg); border: 1px solid var(--border);
  border-radius: 10px 10px 10px 2px;
}

/* Markdown in bubbles */
.bubble h1 { font-size: 16px; margin: 10px 0 5px; color: var(--accent-h); }
.bubble h2 { font-size: 14px; margin: 10px 0 4px; color: var(--accent-h); }
.bubble h3 { font-size: 13px; margin: 8px 0 3px; color: var(--text); font-weight: 600; }
.bubble ul, .bubble ol { margin: 4px 0 6px 20px; }
.bubble li { margin: 3px 0; }
.bubble strong { color: var(--accent-h); }
.bubble em { color: #b0a0d8; }
.bubble p  { margin: 5px 0; }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.bubble code {
  font-family: var(--mono); font-size: 12px;
  background: var(--surface3); padding: 1px 5px; border-radius: 3px;
}
.bubble pre {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; margin: 8px 0; overflow-x: auto;
}
.bubble pre code { background: none; padding: 0; font-size: 12px; }

.sources-line {
  font-size: 11px; color: var(--text-muted);
  margin-top: 5px; padding-left: 2px;
}
.src-link { color: var(--accent); cursor: pointer; }
.src-link:hover { text-decoration: underline; }

/* ── Loading dots ────────────────────────────────────────────── */
.dots { display: flex; gap: 5px; align-items: center; padding: 3px 0; }
.dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); opacity: 0.2;
  animation: pulse 1.4s ease-in-out infinite;
}
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
  40%            { opacity: 1;   transform: scale(1.0); }
}

/* ── Chat input ──────────────────────────────────────────────── */
.chat-bar {
  padding: 14px 20px; border-top: 1px solid var(--border);
  background: var(--surface); display: flex; gap: 10px; flex-shrink: 0;
}
#chat-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; color: var(--text);
  font-size: 14px; outline: none; transition: border-color 0.15s;
  font-family: var(--font);
}
#chat-input:focus { border-color: var(--accent); }
#send-btn { padding: 10px 20px; font-size: 14px; }

/* ── Modals ──────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; animation: fade 0.12s ease;
}
.overlay.hidden { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; flex-direction: column;
  overflow: hidden; animation: slide-up 0.15s ease;
}
@keyframes slide-up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

.modal-head {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h2 { font-size: 14px; font-weight: 600; }
.modal-x {
  background: none; border: none; color: var(--text-muted);
  font-size: 22px; cursor: pointer; line-height: 1; padding: 0 2px;
}
.modal-x:hover { color: var(--text); }

.modal-body {
  padding: 18px; overflow-y: auto;
  font-size: 13px; line-height: 1.7;
}
.modal-body::-webkit-scrollbar { width: 4px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Note modal — reuse bubble markdown styles */
.modal-body h1 { font-size: 18px; color: var(--accent-h); margin-bottom: 10px; }
.modal-body h2 { font-size: 15px; color: var(--accent-h); margin: 12px 0 5px; }
.modal-body h3 { font-size: 13px; color: var(--text); font-weight: 600; margin: 10px 0 4px; }
.modal-body ul, .modal-body ol { margin: 4px 0 8px 18px; }
.modal-body li { margin: 3px 0; }
.modal-body p  { margin: 6px 0; }
.modal-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.modal-body strong { color: var(--accent-h); }
.modal-body em     { color: #b0a0d8; }
.modal-body code {
  font-family: var(--mono); font-size: 12px;
  background: var(--surface2); padding: 1px 5px; border-radius: 3px;
}
.modal-body pre {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; margin: 8px 0; overflow-x: auto;
}
.modal-body pre code { background: none; padding: 0; }

/* Username modal */
.username-modal { width: 340px; }
.username-modal .modal-body { text-align: center; }
.username-modal .icon { font-size: 42px; margin-bottom: 10px; }
.username-modal h2 { font-size: 16px; margin-bottom: 6px; }
.username-modal p  { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
#username-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 9px 12px; color: var(--text);
  font-size: 14px; outline: none; margin-bottom: 10px; text-align: center;
  font-family: var(--font); transition: border-color 0.15s;
}
#username-input:focus { border-color: var(--accent); }
#username-submit { width: 100%; padding: 9px; font-size: 14px; }

/* Note modal */
.note-modal { width: min(700px, 92vw); max-height: 82vh; }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ── Username modal ─────────────────────────────────────── -->
<div class="overlay hidden" id="username-overlay">
  <div class="modal username-modal">
    <div class="modal-body">
      <div class="icon">🧠</div>
      <h2>Welcome to NeuroNourish</h2>
      <p>Enter your name to get started</p>
      <input id="username-input" type="text" placeholder="Your name" maxlength="30" autocomplete="off">
      <button class="btn" id="username-submit">Get Started</button>
    </div>
  </div>
</div>

<!-- ── Note viewer modal ──────────────────────────────────── -->
<div class="overlay hidden" id="note-overlay">
  <div class="modal note-modal">
    <div class="modal-head">
      <h2 id="note-title"></h2>
      <button class="modal-x" id="note-close">&times;</button>
    </div>
    <div class="modal-body" id="note-body"></div>
  </div>
</div>

<!-- ── App shell ──────────────────────────────────────────── -->
<div class="layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>🧠 NeuroNourish</h1>
      <div class="tagline">Groq-powered wiki knowledge base</div>
    </div>

    <div class="sidebar-scroll">

      <!-- Ingest -->
      <div class="s-section">
        <div class="s-label">Ingest Knowledge</div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="topic">Topic</button>
          <button class="tab-btn"        data-tab="url"  >URL</button>
          <button class="tab-btn"        data-tab="pdf"  >PDF</button>
        </div>

        <div class="tab-pane active" id="tab-topic">
          <div class="ingest-row">
            <input type="text" id="topic-input" placeholder="e.g. Omega-3 fatty acids">
            <button class="btn" id="topic-btn">Ingest</button>
          </div>
        </div>

        <div class="tab-pane" id="tab-url">
          <div class="ingest-row">
            <input type="text" id="url-input" placeholder="https://…">
            <button class="btn" id="url-btn">Ingest</button>
          </div>
        </div>

        <div class="tab-pane" id="tab-pdf">
          <div class="pdf-row">
            <input type="file" id="pdf-input" accept=".pdf">
            <button class="btn" id="pdf-btn">Upload</button>
          </div>
        </div>

        <div id="ingest-status" class="status"></div>
        <!-- Suggestion chips rendered here after each successful ingest -->
        <div id="ingest-suggestions"></div>
      </div>

      <!-- Vault notes -->
      <div class="s-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0">
        <div class="notes-head">
          <div class="s-label" style="margin:0">Vault Notes</div>
          <button class="btn btn-ghost btn-sm" id="refresh-btn">↻</button>
        </div>
        <div class="notes-list" id="notes-list">
          <div style="font-size:11px;color:var(--text-muted)">Loading…</div>
        </div>
      </div>

      <!-- Team Activity -->
      <div class="s-section">
        <div class="activity-header" onclick="toggleActivity()">
          <div class="s-label" style="margin:0">
            Team Activity
            <span class="pulse-dot hidden" id="activity-dot"></span>
          </div>
          <button class="act-toggle" id="act-chevron">▾</button>
        </div>
        <!-- Scrollable list of last 20 entries, newest first -->
        <div class="activity-list" id="activity-list">
          <div style="font-size:11px;color:var(--text-muted)">Loading…</div>
        </div>
      </div>

    </div><!-- /sidebar-scroll -->
  </aside>

  <!-- MAIN CHAT PANEL -->
  <main class="chat-panel">

    <div class="chat-head">
      <span class="chat-head-title">Ask your wiki</span>
      <span class="username-badge" id="username-display">—</span>
      <a class="not-you" id="not-you-link" href="#">Not you?</a>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="icon">🧠</div>
        <h2>What would you like to know?</h2>
        <p>NeuroNourish grounds every answer in your ingested wiki notes.</p>
      </div>
    </div>

    <div class="chat-bar">
      <input type="text" id="chat-input" placeholder="Ask your wiki…" autocomplete="off">
      <button class="btn" id="send-btn">Send</button>
    </div>

  </main>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
let chatHistory = [];

// ─────────────────────────────────────────────────────────────
// Username
// ─────────────────────────────────────────────────────────────
const getUser = () => localStorage.getItem('nn_username') || 'anonymous';

function applyUsername(name) {
  localStorage.setItem('nn_username', name);
  document.getElementById('username-display').textContent = name;
  document.getElementById('username-overlay').classList.add('hidden');
}

function initUsername() {
  const stored = localStorage.getItem('nn_username');
  if (stored) {
    applyUsername(stored);
  } else {
    // No name found — reveal the modal (it starts hidden)
    document.getElementById('username-overlay').classList.remove('hidden');
    setTimeout(() => document.getElementById('username-input').focus(), 80);
  }
}

// Clear stored name and reload so the user can enter a new one
function clearUser() {
  localStorage.removeItem('nn_username');
  location.reload();
}

document.getElementById('not-you-link').addEventListener('click', e => {
  e.preventDefault();
  clearUser();
});

document.getElementById('username-submit').addEventListener('click', () => {
  const v = document.getElementById('username-input').value.trim();
  if (v) applyUsername(v);
});
document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = e.target.value.trim();
    if (v) applyUsername(v);
  }
});

// ─────────────────────────────────────────────────────────────
// API helper — always sends X-Username header
// ─────────────────────────────────────────────────────────────
async function api(url, opts = {}) {
  opts.headers = { 'X-Username': getUser(), ...(opts.headers || {}) };
  const res = await fetch(url, opts);
  return res.json();
}

// ─────────────────────────────────────────────────────────────
// Tab switching
// ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ─────────────────────────────────────────────────────────────
// Status helper
// ─────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('ingest-status');
  el.textContent = msg;
  el.className = 'status ' + type;
  if (type === 'ok') setTimeout(() => (el.className = 'status'), 6000);
}

function setBusy(btnId, label, busy) {
  const btn = document.getElementById(btnId);
  btn.disabled = busy;
  btn.textContent = busy ? '…' : label;
}

// ─────────────────────────────────────────────────────────────
// Ingest — topic
// ─────────────────────────────────────────────────────────────
async function ingestTopic() {
  const val = document.getElementById('topic-input').value.trim();
  if (!val) return;
  setBusy('topic-btn', 'Ingest', true);
  showStatus('Fetching from Wikipedia…', '');
  try {
    const d = await api('/ingest/topic', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: val }),
    });
    if (d.success) {
      showStatus(`✓ ${d.filename}  (${d.word_count} words)`, 'ok');
      document.getElementById('topic-input').value = '';
      loadNotes();
      showIngestSuggestions(d.suggestions || []);
    } else {
      showStatus('Error: ' + d.error, 'err');
      showIngestSuggestions([]);
    }
  } catch (e) { showStatus('Error: ' + e.message, 'err'); showIngestSuggestions([]); }
  setBusy('topic-btn', 'Ingest', false);
}

// ─────────────────────────────────────────────────────────────
// Notes list
// ─────────────────────────────────────────────────────────────
function fmtDate(iso) {
  const d = new Date(iso), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
}

async function loadNotes() {
  const list = document.getElementById('notes-list');
  try {
    const d = await api('/notes');
    const notes = (d.notes || []).sort((a, b) => b.modified.localeCompare(a.modified));
    if (!notes.length) {
      list.innerHTML = '<div style="font-size:11px;color:var(--text-muted)">No notes yet</div>';
      return;
    }
    list.innerHTML = notes.map(n => `
      <div class="note-item" data-file="${esc(n.filename)}">
        <span class="note-name">${esc(n.filename.replace('.md', ''))}</span>
        <span class="note-date">${fmtDate(n.modified)}</span>
      </div>`).join('');
    list.querySelectorAll('.note-item').forEach(el =>
      el.addEventListener('click', () => openNote(el.dataset.file))
    );
  } catch (_) {
    list.innerHTML = '<div style="font-size:11px;color:var(--error)">Failed to load</div>';
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadNotes);

// ─────────────────────────────────────────────────────────────
// Ingest suggestion chips
// ─────────────────────────────────────────────────────────────
function showIngestSuggestions(suggestions) {
  const container = document.getElementById('ingest-suggestions');
  if (!suggestions.length) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div class="suggest-wrap">
      <div class="suggest-label">Where to go next</div>
      <div class="chip-row">${suggestions.map(s =>
        `<button class="chip" data-topic="${esc(s)}"><em class="chip-arrow">→</em> ${esc(s)}</button>`
      ).join('')}</div>
    </div>`;
  // Clicking a chip switches to the Topic tab and pre-fills the input
  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="topic"]').classList.add('active');
      document.getElementById('tab-topic').classList.add('active');
      document.getElementById('topic-input').value = chip.dataset.topic;
      document.getElementById('topic-input').focus();
    });
  });
}

async function openNote(filename) {
  document.getElementById('note-title').textContent = filename.replace('.md', '');
  document.getElementById('note-body').innerHTML = '<div style="color:var(--text-muted)">Loading…</div>';
  document.getElementById('note-overlay').classList.remove('hidden');

}

);

    document.getElementById('note-overlay').classList.add('hidden');
});

// ─────────────────────────────────────────────────────────────
// Markdown → HTML  (handles the structured format our notes use)
// ─────────────────────────────────────────────────────────────
function mdToHtml(md) {
  // Protect fenced code blocks
  const blocks = [];
  md = md.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) => {
    blocks.push(`<pre><code>${escHtml(code.trim())}</code></pre>`);
    return `\x00BLOCK${blocks.length - 1}\x00`;
  });

  // Inline code
  md = md.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
  // Horizontal rule
  md = md.replace(/^---$/gm, '<hr>');
  // Headings
  md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  md = md.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  md = md.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
  // Bold / italic
  md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  md = md.replace(/\*(.+?)\*/g,     '<em>$1</em>');
  // Bullet lists
  md = md.replace(/((?:^[*\-] .+\n?)+)/gm, match => {
    const items = match.trim().split('\n')
      .map(l => `<li>${l.replace(/^[*\-] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // Plain paragraphs (lines not starting with a tag)
  md = md.replace(/^(?!<[hup]|<hr|<ul|<pre|\x00)(.+)$/gm, '<p>$1</p>');
  // Restore code blocks
  md = md.replace(/\x00BLOCK(\d+)\x00/g, (_, i) => blocks[+i]);
  return md;
}

// ─────────────────────────────────────────────────────────────
// Chat
// ─────────────────────────────────────────────────────────────
async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  // Remove welcome screen on first message
  document.getElementById('welcome')?.remove();

  input.value = '';
  input.disabled = true;
  document.getElementById('send-btn').disabled = true;

  addUserBubble(msg);
  const loader = addLoader();

  try {
    const d = await api('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, history: chatHistory }),
    });
    loader.remove();
    addAssistantBubble(d.response || '(no response)', d.sources || [], d.suggestions || []);

    // Store plain text in history — context is re-injected server-side each turn
    chatHistory.push({ role: 'user',      content: msg });
    chatHistory.push({ role: 'assistant', content: d.response });
  } catch (e) {
    loader.remove();
    addAssistantBubble('Error: ' + e.message, [], []);
  }

  input.disabled = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escHtml(text).replace(/\n/g,'<br>')}</div>`;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
}

function addAssistantBubble(text, sources, suggestions = []) {
  const div = document.createElement('div');
  div.className = 'msg assistant';

  const srcs = sources.length
    ? `<div class="sources-line">Sources: ${
        sources.map(s => `<span class="src-link" data-file="${esc(s)}">${esc(s)}</span>`).join(', ')
      }</div>`
    : '';

  // Suggestion chips that send themselves as a new chat message when clicked
  const chips = suggestions.length
    ? `<div class="suggest-wrap" style="margin-top:10px">
        <div class="suggest-label">Explore next</div>
        <div class="chip-row">${suggestions.map(s =>
          `<button class="chip chat-chip" data-query="${esc(s)}"><em class="chip-arrow">→</em> ${esc(s)}</button>`
        ).join('')}</div>
      </div>`
    : '';

  div.innerHTML = `<div class="bubble">${mdToHtml(text)}</div>${srcs}${chips}`;

  div.querySelectorAll('.src-link').forEach(el =>
    el.addEventListener('click', () => openNote(el.dataset.file))
  );

  // Each chat chip pre-fills and submits the chat input
  div.querySelectorAll('.chat-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.getElementById('chat-input').value = chip.dataset.query;
      sendChat();
    });
  });

  document.getElementById('messages').appendChild(div);
  scrollBottom();
}

function addLoader() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = '<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>';
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

document.getElementById('send-btn').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) sendChat();
});

// ─────────────────────────────────────────────────────────────
// Team Activity
// ─────────────────────────────────────────────────────────────
function trunc(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); }

// Timestamp of the newest entry seen on the last load (for new-entry detection)
let lastActivityTs = null;

const BADGE_CLASS = { ingest_topic:'badge-topic', ingest_url:'badge-url', ingest_pdf:'badge-pdf', chat:'badge-chat' };
const BADGE_LABEL = { ingest_topic:'Topic',       ingest_url:'URL',       ingest_pdf:'PDF',       chat:'Chat'       };

// Human-readable relative timestamps
function relTime(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)     return 'just now';
  if (diff < 3600)   { const m = Math.floor(diff / 60);   return m + ' min'  + (m  > 1 ? 's' : '') + ' ago'; }
  if (diff < 86400)  { const h = Math.floor(diff / 3600); return h + ' hour' + (h  > 1 ? 's' : '') + ' ago'; }
  if (diff < 172800) return 'Yesterday';
  return new Date(iso).toLocaleDateString('en', { month: 'short', day: 'numeric' });
}

async function loadActivity() {
  const list = document.getElementById('activity-list');
  try {
    const d = await api('/activity');
    // Server already returns newest-first; show up to 20
    const entries = (d.activity || []).slice(0, 20);

    // Show pulsing dot if a newer entry appeared since last poll
    if (entries.length) {
      if (lastActivityTs && entries[0].timestamp > lastActivityTs)
        document.getElementById('activity-dot').classList.remove('hidden');
      lastActivityTs = entries[0].timestamp;
    }

    if (!entries.length) {
      list.innerHTML = '<div style="font-size:11px;color:var(--text-muted)">No activity yet</div>';
      return;
    }

    list.innerHTML = entries.map(e => `
      <div class="act-item">
        <div>
          <span class="badge ${BADGE_CLASS[e.action] || ''}">${BADGE_LABEL[e.action] || e.action}</span>
          <span class="act-user">${esc(e.user)}</span>
        </div>
        <div class="act-detail">${esc(trunc(e.detail, 40))}</div>
        <div class="act-time">${relTime(e.timestamp)}</div>
      </div>`).join('');
  } catch (_) {}
}

// Collapse/expand the Team Activity panel; clears the new-entry dot on expand
function toggleActivity() {
  const body = document.getElementById('activity-list');
  const chevron = document.getElementById('act-chevron');
  const isHidden = body.style.display === 'none';
  body.style.display = isHidden ? '' : 'none';
  chevron.textContent = isHidden ? '▾' : '▸';
  if (isHidden) document.getElementById('activity-dot').classList.add('hidden');
}

// Refresh every 60 seconds
setInterval(loadActivity, 60000);

// ─────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// Short alias used in template literals for attribute/text escaping
const esc = escHtml;

// ─────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────
initUsername();
loadNotes();
loadActivity();
</script>

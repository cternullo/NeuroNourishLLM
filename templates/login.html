<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NeuroNourish</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f; --surface: #13131a; --surface2: #1a1a24;
  --border: #27273a; --text: #d6d6e0; --text-muted: #52527a;
  --accent: #7c5cbf; --accent-h: #a07de8; --accent-dim: #32284d;
  --error: #e05555;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px;
}
body { display: flex; align-items: center; justify-content: center; padding: 20px; }

.card {
  width: 100%; max-width: 380px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 36px 32px;
}
.brand {
  text-align: center; margin-bottom: 28px;
}
.brand-icon { font-size: 36px; display: block; margin-bottom: 10px; }
.brand-name { font-size: 20px; font-weight: 700; color: var(--accent-h); letter-spacing: -0.3px; }
.brand-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.3px; text-transform: uppercase; }
input[type="text"], input[type="password"] {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 10px 13px; color: var(--text);
  font-size: 14px; outline: none; transition: border-color 0.15s;
  font-family: var(--font);
}
input:focus { border-color: var(--accent); }

.btn-submit {
  width: 100%; padding: 11px; background: var(--accent); border: none;
  border-radius: 7px; color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.12s; margin-top: 6px;
  font-family: var(--font);
}
.btn-submit:hover { background: var(--accent-h); }
.btn-submit:active { transform: scale(0.99); }

.error-msg {
  background: #2a0e0e; border: 1px solid #5a1515;
  color: var(--error); border-radius: 7px;
  padding: 10px 13px; font-size: 13px; margin-bottom: 16px;
}
.footer-link {
  text-align: center; margin-top: 20px;
  font-size: 13px; color: var(--text-muted);
}
.footer-link a { color: var(--accent-h); text-decoration: none; }
.footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="brand-icon">🧠</span>
    <div class="brand-name">NeuroNourish</div>
    <div class="brand-sub">Groq-powered research knowledge base</div>
  </div>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/auth/login">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-submit">Sign in</button>
  </form>

  <div class="footer-link">
    Don't have an account? <a href="/auth/register">Register</a>
  </div>
</div>
</body>
</html>
